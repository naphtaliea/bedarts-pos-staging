<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 90">
  <!-- Snowflake icon centered at (44, 45) -->
  <g transform="translate(44,45)">
    <!-- Red shadow layer, offset (3,3) -->
    <g stroke="#CC1B14" stroke-width="5.5" stroke-linecap="round" fill="none" transform="translate(3,3)">
      <line x1="0" y1="-33" x2="0" y2="33"/>
      <line x1="-28.6" y1="-16.5" x2="28.6" y2="16.5"/>
      <line x1="28.6" y1="-16.5" x2="-28.6" y2="16.5"/>
      <!-- vertical arm branches -->
      <line x1="0" y1="-21" x2="7.8" y2="-25.5"/>
      <line x1="0" y1="-21" x2="-7.8" y2="-25.5"/>
      <line x1="0" y1="21" x2="-7.8" y2="25.5"/>
      <line x1="0" y1="21" x2="7.8" y2="25.5"/>
      <!-- upper-right arm branches -->
      <line x1="18.2" y1="-10.5" x2="26" y2="-6"/>
      <line x1="18.2" y1="-10.5" x2="18.2" y2="-19.5"/>
      <!-- lower-left arm branches -->
      <line x1="-18.2" y1="10.5" x2="-26" y2="6"/>
      <line x1="-18.2" y1="10.5" x2="-18.2" y2="19.5"/>
      <!-- upper-left arm branches -->
      <line x1="-18.2" y1="-10.5" x2="-18.2" y2="-19.5"/>
      <line x1="-18.2" y1="-10.5" x2="-26" y2="-6"/>
      <!-- lower-right arm branches -->
      <line x1="18.2" y1="10.5" x2="18.2" y2="19.5"/>
      <line x1="18.2" y1="10.5" x2="26" y2="6"/>
    </g>
    <!-- Blue main snowflake -->
    <g stroke="#1B50C0" stroke-width="5.5" stroke-linecap="round" fill="none">
      <line x1="0" y1="-33" x2="0" y2="33"/>
      <line x1="-28.6" y1="-16.5" x2="28.6" y2="16.5"/>
      <line x1="28.6" y1="-16.5" x2="-28.6" y2="16.5"/>
      <line x1="0" y1="-21" x2="7.8" y2="-25.5"/>
      <line x1="0" y1="-21" x2="-7.8" y2="-25.5"/>
      <line x1="0" y1="21" x2="-7.8" y2="25.5"/>
      <line x1="0" y1="21" x2="7.8" y2="25.5"/>
      <line x1="18.2" y1="-10.5" x2="26" y2="-6"/>
      <line x1="18.2" y1="-10.5" x2="18.2" y2="-19.5"/>
      <line x1="-18.2" y1="10.5" x2="-26" y2="6"/>
      <line x1="-18.2" y1="10.5" x2="-18.2" y2="19.5"/>
      <line x1="-18.2" y1="-10.5" x2="-18.2" y2="-19.5"/>
      <line x1="-18.2" y1="-10.5" x2="-26" y2="-6"/>
      <line x1="18.2" y1="10.5" x2="18.2" y2="19.5"/>
      <line x1="18.2" y1="10.5" x2="26" y2="6"/>
    </g>
  </g>
  <!-- "Bedarts" -->
  <text x="93" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#CC1B14">Bedarts</text>
  <!-- "COLD SUPPLIES" -->
  <text x="96" y="69" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1B50C0" letter-spacing="4.5">COLD SUPPLIES</text>
</svg>
